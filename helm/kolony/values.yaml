# Default values for kolony
replicaCount: 1

image:
  repository: colonyos/kolony
  pullPolicy: Always
  tag: "v0.1.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# ColonyOS credentials Secret ("<namespace>/<name>") used for Blueprints and ColonyProcesses in
# namespaces that have no colonyos-credentials Secret of their own, e.g. namespaces that a tool
# creates per request. BlueprintDefinitions always need their own, so this Secret needs no
# colonyPrvKey. Leave empty to require a Secret in every namespace.
defaultCredentialsSecret: ""
# Label selector limiting defaultCredentialsSecret to matching namespaces, e.g. a label set by
# the tool that creates them. Leave empty to allow every namespace.
defaultCredentialsNamespaceSelector: ""

# Leader election configuration
leaderElection:
  enabled: true
  leaseDuration: 15s
  renewDeadline: 10s
  retryPeriod: 2s

# Logging configuration
logging:
  level: info
  encoder: json

# Metrics configuration
metrics:
  enabled: true
  port: 8080

# Health probes configuration
health:
  port: 8081
