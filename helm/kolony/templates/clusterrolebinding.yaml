apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kolony.fullname" . }}-manager-rolebinding
  labels:
    {{- include "kolony.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kolony.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "kolony.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kolony.fullname" . }}-leader-election-rolebinding
  labels:
    {{- include "kolony.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kolony.fullname" . }}-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ include "kolony.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
