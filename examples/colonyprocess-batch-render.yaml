# Batch Rendering ColonyProcess Example
#
# Submits a 3D rendering job for animation frames.
# Multiple ColonyProcess resources can be created for parallel frame rendering.
#
apiVersion: colony.colonyos.io/v1
kind: ColonyProcess
metadata:
  name: render-frame-0001
  namespace: default
spec:
  funcName: render_frame
  executorType: render-executor

  kwargs:
    scene_file: s3://assets/project-x/scene.blend
    frame_number: 1
    output_path: s3://renders/project-x/frame_0001.exr
    resolution:
      width: 3840
      height: 2160
    samples: 512
    denoising: true
    render_engine: cycles

  conditions:
    cpu: 8
    memory: 32000
    gpu:
      count: 1
      name: nvidia-rtx-4090

  maxWaitTime: 600
  maxExecTime: 3600
  maxRetries: 1
