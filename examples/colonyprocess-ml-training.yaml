# ML Training ColonyProcess Example
#
# Submits a machine learning training job to ColonyOS with GPU requirements.
# The process will be assigned to an executor that meets the specified conditions.
#
apiVersion: colony.colonyos.io/v1
kind: ColonyProcess
metadata:
  name: train-resnet50
  namespace: default
spec:
  funcName: train_model
  executorType: gpu-executor

  # Positional arguments
  args:
    - "--epochs=100"
    - "--batch-size=64"

  # Keyword arguments (arbitrary key-value pairs)
  kwargs:
    model: resnet50
    dataset: s3://datasets/imagenet-1k
    output_path: s3://models/resnet50-v3
    learning_rate: 0.001
    optimizer: adam
    checkpoint_interval: 10

  # Environment variables
  env:
    CUDA_VISIBLE_DEVICES: "0,1"
    WANDB_PROJECT: "image-classification"
    NCCL_DEBUG: "INFO"

  # Resource requirements
  conditions:
    nodes: 1
    cpu: 16
    memory: 128000  # MB
    gpu:
      count: 2
      name: nvidia-a100
      memory: 40000  # MB

  # Timing constraints
  maxWaitTime: 3600      # Max 1 hour in queue
  maxExecTime: 86400     # Max 24 hours execution
  maxRetries: 2          # Retry twice on failure
