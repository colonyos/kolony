# Data Export ColonyProcess Example
#
# Submits a data export job to process and export data to cloud storage.
#
apiVersion: colony.colonyos.io/v1
kind: ColonyProcess
metadata:
  name: daily-export-20260103
  namespace: default
spec:
  funcName: export_data
  executorType: etl-executor

  kwargs:
    source_table: analytics.user_events
    destination: s3://exports/daily/2026-01-03/
    format: parquet
    partition_by:
      - event_date
      - region
    compression: snappy
    filters:
      event_date: "2026-01-03"

  env:
    AWS_REGION: "us-west-2"

  conditions:
    cpu: 4
    memory: 16000

  maxWaitTime: 1800
  maxExecTime: 7200
