# ColonyOS Credentials Secret
#
# This secret must be created in each namespace where you want to use Kolony resources.
# Replace the placeholder values with your actual ColonyOS credentials.
#
# IMPORTANT: Do not commit this file with real credentials to version control!
# Consider using sealed-secrets or external-secrets for production deployments.
#
apiVersion: v1
kind: Secret
metadata:
  name: colonyos-credentials
  # Change this to your target namespace
  namespace: default
type: Opaque
stringData:
  # ColonyOS server hostname
  serverHost: "server.colonyos.io"
  # ColonyOS server port
  serverPort: "443"
  # Enable TLS (true/false)
  tls: "true"
  # Your colony name
  colonyName: "my-colony"
  # Colony private key (hex-encoded) - required for BlueprintDefinition operations
  colonyPrvKey: "your-colony-private-key-here"
  # Executor private key (hex-encoded) - required for Blueprint and ColonyProcess operations
  executorPrvKey: "your-executor-private-key-here"
