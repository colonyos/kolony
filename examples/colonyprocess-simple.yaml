# Simple ColonyProcess Example
#
# Submits a basic function to ColonyOS and tracks its execution.
# Uses container-executor to run a simple echo command in a container.
#
apiVersion: colony.colonyos.io/v1
kind: ColonyProcess
metadata:
  generateName: hello-world-
  namespace: default
spec:
  # Function name for container-executor
  funcName: execute
  # Type of executor to run this function
  executorType: container-executor
  # Container configuration
  kwargs:
    docker-image: alpine:latest
    cmd: "echo 'Hello from Kubernetes via ColonyOS!'"
  # Timing constraints
  maxWaitTime: 300
  maxExecTime: 60
