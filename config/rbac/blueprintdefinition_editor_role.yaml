# This rule is not used by the project kolony itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the colony.colonyos.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kolony
    app.kubernetes.io/managed-by: kustomize
  name: blueprintdefinition-editor-role
rules:
- apiGroups:
  - colony.colonyos.io
  resources:
  - blueprintdefinitions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - colony.colonyos.io
  resources:
  - blueprintdefinitions/status
  verbs:
  - get
